<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>adminに提出 - review4b</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, sans-serif;
    }

    body {
      margin: 0;
      padding: 32px;
      line-height: 1.5;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      font: inherit;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 650;
    }

    button {
      display: inline-block;
      margin-top: 16px;
      padding: 8px 12px;
      color: inherit;
      border: 1px solid currentColor;
      background: transparent;
      cursor: pointer;
    }

    a {
      color: inherit;
    }

    .muted {
      opacity: .75;
    }

    .review-result {
      white-space: pre-wrap;
      border: 1px solid currentColor;
      padding: 12px;
      margin: 18px 0 0;
      font: 13px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .review-result:empty {
      display: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>adminに提出</h1>
    <p class="muted">{{MESSAGE}}</p>
    <pre class="review-result">{{REVIEW_RESULT}}</pre>

    <form method="post" action="/report">
      <label for="id">ノート ID</label>
      <input id="id" name="id" required pattern="[a-f0-9]{16}" placeholder="0123456789abcdef">

      <button type="submit">提出</button>
    </form>

    <p><a href="/">ノート作成に戻る</a></p>
  </main>
</body>
</html>
