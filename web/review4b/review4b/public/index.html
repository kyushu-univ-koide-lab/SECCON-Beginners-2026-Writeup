<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>review4b</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, sans-serif;
    }

    body {
      margin: 0;
      padding: 32px;
      line-height: 1.5;
    }

    main {
      max-width: 980px;
      margin: 0 auto;
    }

    textarea,
    input {
      width: 100%;
      box-sizing: border-box;
      font: inherit;
    }

    textarea {
      min-height: 180px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 650;
    }

    button {
      display: inline-block;
      margin-top: 16px;
      padding: 8px 12px;
      color: inherit;
      border: 1px solid currentColor;
      background: transparent;
      cursor: pointer;
    }

    .muted {
      opacity: .75;
    }

    a {
      color: inherit;
    }
  </style>
</head>
<body>
  <main>
    <h1>review4b</h1>
    <p class="muted">HTML でノートを作成できます。</p>

    <form method="post" action="/notes">
      <label for="id">更新するノートID（任意）</label>
      <input id="id" name="id" placeholder="新しいノートを作る場合は空のまま">

      <label for="html">HTML</label>
      <textarea id="html" name="html" spellcheck="false">&lt;p&gt;レビューお願いします。&lt;/p&gt;</textarea>
      <input type="hidden" name="css" value="#probe { display: block; width: 1px; height: 1px; }">

      <button type="submit">ノートを保存</button>
    </form>

    <p><a href="/report">adminに提出する</a></p>
  </main>
</body>
</html>
